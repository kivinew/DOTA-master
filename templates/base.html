<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DOTA_MASTER — Статистика игр{% endblock %}</title>
        <meta id="theme-color" name="theme-color" content="#0d0d12">
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%3C/text%3E%3C/svg%3E">
        <!-- One shared layout stylesheet; themes change color tokens only. -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/dota.css', v='10') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/dota-modern.css', v='2') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/match-detail.css', v='1') }}">
        {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="dota-header">
        <a href="{{ url_for('index') }}" class="dota-logo">
            <div class="dota-logo-icon">⚔️</div>
            <div>
                <div class="dota-logo-text">DOTA_MASTER</div>
                <div class="dota-logo-sub">Статистика игр в DOTA 2</div>
            </div>
        </a>
        <nav class="nav-bar">
            {% set path = request.path %}
            <a href="{{ url_for('index') }}" class="nav-link{% if path == '/' %} active{% endif %}">📊 Дашборд</a>
            <a href="{{ url_for('games_page') }}" class="nav-link{% if path.startswith('/games') %} active{% endif %}">📋 Игры</a>
            <a href="{{ url_for('fresh_page') }}" class="nav-link{% if path.startswith('/fresh') %} active{% endif %}">🔄 Свежие</a>
            <a href="{{ url_for('errors_page') }}" class="nav-link{% if path.startswith('/errors') %} active{% endif %}">⚠️ Ошибки</a>
            <a href="{{ url_for('macro_page') }}" class="nav-link{% if path.startswith('/macro') %} active{% endif %}">📈 Анализ</a>
            <a href="{{ url_for('report_page') }}" class="nav-link{% if path.startswith('/report') %} active{% endif %}">📋 Отчёт</a>
            <a href="{{ url_for('heroes_page') }}" class="nav-link{% if path.startswith('/heroes') %} active{% endif %}">👹 Герои</a>
            <a href="{{ url_for('api_page') }}" class="nav-link{% if path.startswith('/api') %} active{% endif %}">📖 API</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему" title="Переключить тему (Ctrl+Shift+T)">
            <span class="theme-icon-sun" aria-hidden="true">☀️</span>
            <span class="theme-icon-moon" aria-hidden="true">🌙</span>
        </button>
    </header>

    <main class="container">
{% block content %}{% endblock %}
        <div class="dota-footer">
            DOTA_MASTER v1.0 · Данные из
            <a href="https://www.opendota.com/players/41099157/matches" target="_blank" rel="noopener">OpenDota</a>
            · SteamID64: 76561198001364885 ·
            <a href="https://steamcommunity.com/id/kivinew/" target="_blank" rel="noopener">kivinew</a>
            · <a href="/api">API</a>
        </div>
    </main>

    <script>
        (function() {
            'use strict';
            
            const THEME_KEY = 'dota_master_theme';
            const toggleBtn = document.getElementById('theme-toggle');
            const html = document.documentElement;
            const themeColorMeta = document.getElementById('theme-color');
            
            function updateToggleIcon() {
                const isDark = html.getAttribute('data-theme') === 'dark';
                const sun = toggleBtn.querySelector('.theme-icon-sun');
                const moon = toggleBtn.querySelector('.theme-icon-moon');
                if (sun && moon) {
                    sun.style.display = isDark ? 'inline' : 'none';
                    moon.style.display = isDark ? 'none' : 'inline';
                }
            }
            
            function applyTheme(theme) {
                html.setAttribute('data-theme', theme);
                if (themeColorMeta) {
                    themeColorMeta.content = theme === 'dark' ? '#0d0d12' : '#f4f0e6';
                }
                updateToggleIcon();
            }
            
            function getSavedTheme() {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    return saved === 'light' || saved === 'dark' ? saved : null;
                } catch (_) {
                    return null;
                }
            }

            function initTheme() {
                // Dota's dark, cinematic palette is the intentional first-visit default.
                applyTheme(getSavedTheme() || 'dark');
            }
            
            function toggleTheme() {
                const current = html.getAttribute('data-theme');
                const nextTheme = current === 'light' ? 'dark' : 'light';
                try { localStorage.setItem(THEME_KEY, nextTheme); } catch (_) { /* private mode */ }
                applyTheme(nextTheme);
                void html.offsetWidth;
            }
            
            if (toggleBtn) {
                toggleBtn.addEventListener('click', toggleTheme);
            }
            
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.shiftKey && e.key === 'T') {
                    e.preventDefault();
                    toggleTheme();
                }
            });
            
            const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');
            if (colorScheme.addEventListener) {
                colorScheme.addEventListener('change', function() {
                    if (!getSavedTheme()) applyTheme('dark');
                });
            }
            
            initTheme();
        })();
    </script>
</body>
</html>
